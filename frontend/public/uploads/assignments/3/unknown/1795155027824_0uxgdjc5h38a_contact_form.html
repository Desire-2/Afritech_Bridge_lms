<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Interactive Contact Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 36px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e8f0ff, #f7f9fc);
      color: #1f2937; display: flex; justify-content: center; align-items: center;
    }
    .container {
      width: 100%; max-width: 680px; background: #fff; padding: 34px;
      border-radius: 16px; box-shadow: 0 12px 35px rgba(31, 41, 55, .12);
    }
    h1 { margin: 0 0 8px; color: #173b72; font-size: 30px; }
    .intro { margin: 0 0 26px; color: #64748b; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font-weight: 700; color: #27364b; }
    input, select, textarea {
      display: block; width: 100%; padding: 12px 13px;
      border: 1px solid #cbd5e1; border-radius: 8px;
      font: inherit; color: #1f2937; background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .14);
    }
    textarea { min-height: 135px; resize: vertical; }
    .hint { color: #64748b; font-size: 12px; margin-top: 5px; }
    .buttons { display: flex; gap: 12px; margin-top: 24px; }
    button {
      border: 0; border-radius: 8px; padding: 12px 20px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .submit { background: #2563eb; color: white; flex: 1; }
    .submit:hover { background: #1d4ed8; }
    .reset { background: #e2e8f0; color: #27364b; }
    .reset:hover { background: #cbd5e1; }
    #status { margin-top: 18px; padding: 12px; border-radius: 8px; display: none; }
    #status.success { display: block; color: #166534; background: #dcfce7; }
    #status.error { display: block; color: #991b1b; background: #fee2e2; }
    .required { color: #dc2626; }
    @media (max-width: 520px) {
      .container { padding: 24px 18px; }
      h1 { font-size: 25px; }
      .buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Get in Touch</h1>
    <p class="intro">Have a question or feedback? Complete the form below and we will be happy to hear from you.</p>

    <form id="contactForm">
      <div class="field">
        <label for="name">Full Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="e.g. Alex Johnson"
               autocomplete="name" minlength="2" maxlength="60" required>
      </div>

      <div class="field">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="you@example.com"
               autocomplete="email" required>
      </div>

      <div class="field">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="+250 7XX XXX XXX"
               autocomplete="tel" pattern="[+]?[0-9 ()-]{7,20}"
               title="Enter 7 to 20 characters using numbers, spaces, parentheses, hyphens, or an optional plus sign."
               required>
        <p class="hint">Use digits and, if needed, spaces, brackets, hyphens or a leading + sign.</p>
      </div>

      <div class="field">
        <label for="subject">Subject <span class="required">*</span></label>
        <select id="subject" name="subject" required>
          <option value="">Choose a subject</option>
          <option value="General question">General question</option>
          <option value="Technical support">Technical support</option>
          <option value="Feedback">Feedback</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message <span class="required">*</span></label>
        <textarea id="message" name="message" placeholder="Write your message here..."
                  minlength="10" maxlength="1000" required></textarea>
        <p class="hint">Please enter at least 10 characters (maximum 1,000).</p>
      </div>

      <div class="buttons">
        <button class="submit" type="submit">Send Message</button>
        <button class="reset" type="reset">Reset Form</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('contactForm');
    const statusBox = document.getElementById('status');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      // The browser checks required fields, email type, minlength and phone pattern.
      if (!form.checkValidity()) {
        form.reportValidity();
        statusBox.className = 'error';
        statusBox.textContent = 'Please correct the highlighted fields before submitting.';
        return;
      }

      statusBox.className = 'success';
      statusBox.textContent = 'Thank you! Your form has passed validation. (Demo only: no message was sent to a server.)';
      form.reset();
    });

    form.addEventListener('reset', function () {
      statusBox.className = '';
      statusBox.textContent = '';
    });
  </script>
</body>
</html>
