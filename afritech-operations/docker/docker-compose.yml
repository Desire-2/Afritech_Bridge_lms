services:
  backend:
    build:
      context: ../backend
    container_name: afritech-ops-backend
    environment:
      FLASK_CONFIG: production
      DATABASE_URL: postgresql://afritech:afritech@db:5432/afritech_operations
      # Required: production refuses to boot on a published placeholder key.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (python -c "import secrets; print(secrets.token_hex(32))")}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (python -c "import secrets; print(secrets.token_hex(32))")}
      CORS_ORIGINS: http://localhost:3001
      # Public frontend URL — notification emails link through this.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      AUTOMATION_INTERVAL_MINUTES: ${AUTOMATION_INTERVAL_MINUTES:-15}
      BUSINESS_NAME: ${BUSINESS_NAME:-AfriTech Bridge Operations}
      CURRENCY: ${CURRENCY:-RWF}
      DEFAULT_COMMISSION_RATE: ${DEFAULT_COMMISSION_RATE:-0.20}
      LMS_API_URL: ${LMS_API_URL:-}
      LMS_API_KEY: ${LMS_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-AfriTech Bridge}
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; import sys;
          body = urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).read();
          sys.exit(0 if b'ok' in body else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: afritech-ops-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3001:3001"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: afritech-ops-db
    environment:
      POSTGRES_USER: afritech
      POSTGRES_PASSWORD: afritech
      POSTGRES_DB: afritech_operations
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afritech -d afritech_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: afritech-ops-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
  uploads-data: